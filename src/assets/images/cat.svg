<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 고양이 몸통 -->
  <ellipse cx="100" cy="130" rx="60" ry="50" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>

  <!-- 고양이 머리 -->
  <circle cx="100" cy="80" r="40" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>

  <!-- 고양이 귀 -->
  <polygon points="75,50 85,20 95,50" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>
  <polygon points="105,50 115,20 125,50" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>

  <!-- 귀 안쪽 -->
  <polygon points="78,45 85,30 92,45" fill="#ffb6c1"/>
  <polygon points="108,45 115,30 122,45" fill="#ffb6c1"/>

  <!-- 고양이 눈 -->
  <ellipse cx="88" cy="75" rx="8" ry="10" fill="#000"/>
  <ellipse cx="112" cy="75" rx="8" ry="10" fill="#000"/>
  <ellipse cx="88" cy="72" rx="3" ry="4" fill="#fff"/>
  <ellipse cx="112" cy="72" rx="3" ry="4" fill="#fff"/>

  <!-- 고양이 코 -->
  <polygon points="100,85 95,90 105,90" fill="#ff1493"/>

  <!-- 고양이 입 -->
  <path d="M 100 92 Q 90 100 85 95" stroke="#000" stroke-width="2" fill="none"/>
  <path d="M 100 92 Q 110 100 115 95" stroke="#000" stroke-width="2" fill="none"/>

  <!-- 수염 -->
  <line x1="60" y1="80" x2="75" y2="82" stroke="#000" stroke-width="2"/>
  <line x1="60" y1="90" x2="75" y2="88" stroke="#000" stroke-width="2"/>
  <line x1="125" y1="82" x2="140" y2="80" stroke="#000" stroke-width="2"/>
  <line x1="125" y1="88" x2="140" y2="90" stroke="#000" stroke-width="2"/>

  <!-- 고양이 발 -->
  <ellipse cx="75" cy="175" rx="15" ry="20" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>
  <ellipse cx="125" cy="175" rx="15" ry="20" fill="#ff7f50" stroke="#ff6347" stroke-width="2"/>

  <!-- 고양이 꼬리 -->
  <path d="M 160 130 Q 180 110 170 90 Q 165 85 175 80" stroke="#ff6347" stroke-width="8" fill="none" stroke-linecap="round"/>
</svg>